name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.lock
      - name: Install locked runtime dependencies
        run: python -m pip install --requirement pipeline/requirements.lock
      - name: Run pipeline tests
        env:
          PYTHONPATH: pipeline/src
        run: |
          python -m unittest discover -s pipeline/tests -p 'test_pipeline.py' -v
          python pipeline/tests/test_golden.py

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
      TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run TypeScript tests
        run: pnpm test:ts
      - name: Run PostgreSQL repository tests
        run: pnpm test:db
      - name: Typecheck workspaces
        run: pnpm typecheck
      - name: Build the web application
        run: pnpm --filter web build
