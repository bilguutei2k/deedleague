[project]
name = "deedleague-pipeline"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "httpx",
  "pydantic",
  "psycopg[binary]",
  "python-dotenv",
]

[project.scripts]
deedleague-pipeline = "pipeline.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
